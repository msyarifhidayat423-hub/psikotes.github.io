<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beranda - Latihan Sikotes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <div class="card">
    <h1 id="sapa">Selamat datang</h1>
    <p class="kecil">Latihan soal sikotes untuk persiapan tes calon bintara.</p>
    <div class="baris">
      <a class="btn" href="latihan.html">Mulai Latihan</a>
      <a class="btn sekunder" href="kraepelin.html">Tes Kraepelin</a>
      <a class="btn sekunder" href="statistik.html">Lihat Statistik</a>
    </div>
  </div>
  <div class="grid">
    <div class="card stat"><div class="angka" id="jumlahSesi">-</div><div class="label">Total sesi</div></div>
    <div class="card stat"><div class="angka" id="rataSkor">-</div><div class="label">Rata-rata skor</div></div>
    <div class="card stat"><div class="angka" id="skorTerakhir">-</div><div class="label">Skor terakhir</div></div>
  </div>
  <div id="pesan" class="pesan hidden"></div>
  <div class="card">
    <h3>Latihan per kategori</h3>
    <div class="baris">
      <a class="btn sekunder" href="latihan.html?kategori=verbal">Verbal</a>
      <a class="btn sekunder" href="latihan.html?kategori=numerik">Numerik</a>
      <a class="btn sekunder" href="latihan.html?kategori=figural">Figural</a>
      <a class="btn sekunder" href="latihan.html?kategori=logika">Logika</a>
    </div>
  </div>
</main>
<script type="module">
  import { wajibLogin } from "./js/auth.js";
  import { ambilHasil } from "./js/db.js";
  import { pasangNavbar, tampilPesan } from "./js/ui.js";
  const user = await wajibLogin();
  pasangNavbar("index.html", user);
  document.getElementById("sapa").textContent = "Halo, " + (user.displayName || user.email);
  try {
    const h = await ambilHasil(user.uid);
    document.getElementById("jumlahSesi").textContent = h.length;
    if (h.length) {
      document.getElementById("rataSkor").textContent = Math.round(h.reduce((a, b) => a + b.skor, 0) / h.length);
      document.getElementById("skorTerakhir").textContent = h[h.length - 1].skor;
    }
  } catch (e) { tampilPesan(document.getElementById("pesan"), "Gagal mengambil data: " + e.message, "error"); }
</script>
</body>
</html>
